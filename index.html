<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Armadilo Chat</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600;800&display=swap');

:root {
  --bg-main: #f2f2f7; --bg-panel: #ffffff; --bg-card: #ffffff; --bg-hover: #e5e5ea;
  --tx-primary: #000000; --tx-secondary: #8e8e93;
  --accent: #ff9500; --accent-hover: #e08300; --on-accent: #ffffff;
  --border-color: #d1d1d6;
  --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.1); --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
  --font-title: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-bold: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --bubble-me: #ff9500; --bubble-them: #ffffff; --on-bubble-me: #ffffff; --on-bubble-them: #000000;
}

body.dark-theme {
  --bg-main: #0a0a0a; --bg-panel: #141414; --bg-card: #1c1c1e; --bg-hover: #262628;
  --tx-primary: #f5f5f5; --tx-secondary: #8e8e93;
  --accent: #e5c158; --accent-hover: #fce28c; --on-accent: #000000;
  --border-color: #2c2c2e;
  --shadow-lg: 0 20px 40px -10px rgba(0, 0, 0, 0.8); --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.4);
  --font-title: 'Playfair Display', Georgia, serif; --font-bold: 'Playfair Display', Georgia, serif;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --bubble-me: #e5c158; --bubble-them: #1c1c1e; --on-bubble-me: #000000; --on-bubble-them: #f5f5f5;
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg-main); color: var(--tx-primary); font: 15px/1.5 var(--font-sans); }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; outline: none; border: none; }

.credits { font-family: var(--font-sans); font-size: 11px; color: var(--tx-secondary); opacity: 0.7; text-align: center; margin-top: 20px; letter-spacing: 0.5px; }

input { width: 100%; padding: 14px 18px; border: 1px solid var(--border-color); border-radius: 12px; background: var(--bg-card); margin: 6px 0; transition: border-color 0.3s, box-shadow 0.3s; }
input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
button { cursor: pointer; border-radius: 12px; padding: 14px 20px; background: var(--accent); color: var(--on-accent); font-weight: 600; letter-spacing: 0.5px; }
button:active { transform: scale(0.98); }
button:hover { background: var(--accent-hover); }
button.g { background: transparent; color: var(--tx-primary); border: 1px solid var(--border-color); }
button.g:hover { background: var(--bg-hover); border-color: var(--tx-secondary); }

/* --- LOGIN BOX --- */
.box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; max-width: 380px; padding: 40px 32px 24px; background: var(--bg-panel); border-radius: 24px; border: 1px solid var(--border-color); box-shadow: var(--shadow-lg); text-align: center; }
h1 { margin: 0 0 8px; font-family: var(--font-title); font-size: 32px; font-weight: 800; letter-spacing: -0.5px; color: var(--accent); }
.mu { color: var(--tx-secondary); font-size: 13px; letter-spacing: 0.5px; }
.tabs { display: flex; gap: 8px; margin: 24px 0 16px; background: var(--bg-main); border-radius: 12px; padding: 6px; }
.tabs button { flex: 1; background: transparent; color: var(--tx-secondary); border-radius: 8px; padding: 10px; font-weight: 600; font-size: 14px; }
.tabs button:not(.g) { background: var(--bg-card); color: var(--accent); box-shadow: var(--shadow-sm); }
#msg { min-height: 22px; margin: 8px 0; font-size: 13px; color: #ff453a; font-weight: 600; }

/* --- LAYOUT UTAMA (LAPTOP) --- */
#chat { display: flex; height: 100%; padding: 16px; gap: 16px; transition: padding-top 0.3s ease; }
body.has-alert #chat { padding-top: 64px; }

#side { width: 320px; display: flex; flex-direction: column; gap: 16px; padding: 24px; background: var(--bg-panel); border-radius: 24px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); z-index: 2; flex-shrink: 0; }
.me { background: var(--bg-card); border-radius: 16px; padding: 20px; border: 1px solid var(--border-color); position: relative; overflow: hidden; }
.me::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.code { font-family: var(--font-bold); font-size: 24px; font-weight: 800; letter-spacing: 0.5px; color: var(--accent); margin: 8px 0; }
#who { font-family: var(--font-bold); font-size: 20px; font-weight: 800; color: var(--accent); margin-bottom: 12px; letter-spacing: -0.5px; }
.row { display: flex; gap: 8px; align-items: center; }
#list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: 8px; padding-right: 4px; }
#list::-webkit-scrollbar { width: 4px; }
#list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
.it { padding: 14px 16px; border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); border: 1px solid transparent; }
.it:hover { border-color: var(--border-color); transform: translateX(2px); }
.it.on { background: var(--bg-hover); border-color: var(--accent); }
.it .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-family: var(--font-sans); font-size: 16px; }
.it .btn-hide { background: transparent; border: none; color: var(--tx-secondary); padding: 6px; border-radius: 50%; font-size: 14px; }
.it .btn-hide:hover { color: #ff453a; }

#main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-panel); border-radius: 24px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); overflow: hidden; position: relative; }

#head { padding: 16px 24px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); display: flex; gap: 12px; align-items: center; font-weight: 600; z-index: 10; flex-shrink: 0; }
#back { display: none; padding: 8px 12px; background: transparent; border: 1px solid var(--border-color); color: var(--tx-primary); border-radius: 8px; font-size: 13px; }
#peer { font-family: var(--font-title); font-size: 20px; letter-spacing: 0.5px; display: flex; flex-direction: column; line-height: 1.2; }
#peer-name { font-weight: 700; }
#peer-status { font-size: 12px; font-weight: 400; font-family: var(--font-sans); color: var(--tx-secondary); letter-spacing: 0.5px; margin-top: 2px; }
#peer-status.online { color: var(--accent); }

#btnDelAll, #btnThemeToggle { background: transparent; border: none; color: var(--tx-secondary); font-size: 18px; padding: 8px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; }
#btnThemeToggle { margin-left: auto; }
#btnThemeToggle:hover { color: var(--accent); background: var(--bg-hover); }
#btnDelAll:hover { color: #ff453a; background: var(--bg-hover); }

#chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; position: relative; }
#chat-container::-webkit-scrollbar { width: 6px; }
#chat-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 6px; }

#msgs { display: flex; flex-direction: column; gap: 16px; width: 100%; }

.m { max-width: 75%; padding: 12px 18px; border-radius: 16px; font-size: 15px; line-height: 1.5; position: relative; word-wrap: break-word; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
.m:not(.me2) { background: var(--bubble-them); color: var(--on-bubble-them); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border-color); }
.m.me2 { background: var(--bubble-me); color: var(--on-bubble-me); align-self: flex-end; border-bottom-right-radius: 4px; cursor: pointer; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
.m small { display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 11px; margin-top: 6px; opacity: 0.8; letter-spacing: 0.5px; }
.m.me2 small { color: var(--on-bubble-me); opacity: 0.9; }

.read-status { font-size: 12px; line-height: 1; }
.read-status.read { color: #34c759; font-weight: 800; }
.read-status.sending { color: rgba(255,255,255,0.6); font-size: 10px; }
.m.me2 .read-status.read { color: #ffffff; } 

#form { padding: 16px 24px; background: var(--bg-panel); border-top: 1px solid var(--border-color); display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
#form input { margin: 0; border-radius: 12px; padding: 14px 18px; background: var(--bg-card); border: 1px solid var(--border-color); }
#form input:focus { border-color: var(--accent); box-shadow: none; }
#form button[type="submit"] { border-radius: 12px; width: auto; padding: 0 24px; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.btn-tool { background: var(--bg-card); color: var(--tx-secondary); font-size: 18px; padding: 0; border: 1px solid var(--border-color); border-radius: 12px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
.btn-tool:hover { border-color: var(--accent); color: var(--accent); }
#btnMic.recording { color: #ff453a; border-color: #ff453a; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

#ctxMenu { position: fixed; z-index: 100; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 8px 0; display: flex; flex-direction: column; min-width: 160px; }
#ctxMenu button { background: transparent; color: var(--tx-primary); text-align: left; padding: 12px 20px; border-radius: 0; font-weight: 500; font-size: 14px; }
#ctxMenu button:hover { background: var(--bg-hover); color: var(--accent); }
#ctxMenu button.del { color: #ff453a; }

.audio-container { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.05); padding: 10px 14px; border-radius: 12px; margin-top: 6px; }
.m.me2 .audio-container { background: rgba(0,0,0,0.1); }
.audio-container button { background: var(--bg-main); color: var(--tx-primary); border-radius: 50%; width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.audio-progress { flex: 1; height: 4px; background: rgba(128,128,128,0.3); border-radius: 2px; overflow: hidden; position: relative; }
.audio-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: var(--accent); transition: width 0.1s; }
.audio-time { font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 500; }

.image-container { margin-top: 8px; border-radius: 12px; overflow: hidden; max-width: 100%; cursor: pointer; width: 250px; height: 250px; background: rgba(128,128,128,0.1); display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color); }
.image-container img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }

#storbar { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--bg-card); color: var(--tx-primary); padding: 12px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 14px; border-radius: 16px; border: 1px solid var(--accent); box-shadow: var(--shadow-lg); width: max-content; max-width: 90%; }
#storbar b { color: var(--accent); }
#storbar .sp { flex: 1; }
#storbar button { padding: 8px 16px; font-size: 13px; border-radius: 8px; }

.empty { margin: auto; color: var(--tx-secondary); text-align: center; font-size: 15px; font-family: var(--font-title); }
#net { font-size: 12px; font-weight: 600; color: var(--accent); text-align: center; margin-top: 12px; letter-spacing: 1px; }

/* --- TAMPILAN MOBILE (HP) YANG SUDAH DI-FIX --- */
@media (max-width: 800px) {
  #chat { 
    padding: 0; 
    gap: 0; 
    height: 100vh; 
    height: 100dvh; /* Dynamic viewport height untuk HP modern */
    display: block; /* Lepas flexbox di mobile */
  }
  
  #side { 
    width: 100%; 
    border-radius: 0; 
    border: none; 
    padding: 20px; 
    height: 100%; 
    overflow-y: auto;
  }
  
  #main { 
    display: none; 
    border-radius: 0; 
    border: none; 
    position: fixed; /* Kunci layar utama */
    inset: 0; /* Memenuhi seluruh layar */
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
  
  #chat.open #side { display: none; }
  #chat.open #main { display: flex; } /* Munculkan layar chat */
  
  #back { display: flex; }
  .box { border-radius: 0; height: 100%; max-width: 100%; display: flex; flex-direction: column; justify-content: center; border: none; }
  
  /* Kunci Header di Atas */
  #head {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 60px;
    z-index: 5;
    padding: 10px 16px;
  }

  /* Area Chat di Tengah */
  #chat-container { 
    position: absolute;
    top: 60px; /* Pas di bawah header */
    bottom: 70px; /* Pas di atas kotak input */
    left: 0; right: 0;
    padding: 16px; 
    overflow-y: auto;
  }

  /* Kotak Input Dikunci di Bawah */
  #form { 
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 70px;
    padding: 10px 12px; 
    gap: 8px; 
    z-index: 5;
  }

  .m { max-width: 88%; font-size: 14px; }
  #form input { padding: 12px 14px; font-size: 14px; }
  #form button[type="submit"] { padding: 0 16px; height: 44px; }
  .btn-tool { width: 44px; height: 44px; font-size: 16px; }
}
</style></head><body>

<div id="storbar" hidden>
  <span>Storage hampir penuh (<b id="storpct">90%</b>).</span>
  <span class="sp"></span>
  <button id="storNow" type="button">Bersihkan</button>
  <button id="storLater" type="button" class="g">Nanti</button>
</div>

<div id="auth" class="box">
  <h1>Armadilo</h1>
  <div class="mu">PRIVATE MESSAGING</div>
  <div class="tabs">
    <button id="tL" type="button">Sign In</button>
    <button id="tR" type="button" class="g">Register</button>
  </div>
  <input id="u" placeholder="Username" autocomplete="username" maxlength="20">
  <input id="c" placeholder="Invite Code" autocomplete="off" maxlength="24">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password" maxlength="72">
  <input id="p2" type="password" placeholder="Confirm Password" autocomplete="new-password" maxlength="72" hidden>
  <label class="mu" style="display:flex; align-items:center; justify-content:center; gap:8px; margin:16px 0;">
    <input id="sh" type="checkbox" style="width:auto; margin:0; accent-color:var(--accent);"> Tampilkan password
  </label>
  <div id="msg"></div>
  <button id="go" type="button" style="width:100%; margin-top:12px;">Masuk</button>
  
  <button id="themeToggleAuth" style="background:transparent; color:var(--tx-secondary); margin-top:16px; font-weight:400; font-size:13px; border:none; cursor:pointer;">🌓 Ubah Tema</button>
  <div class="credits">Created by Bustami Atmadja × DeepSeek</div>
</div>

<div id="chat" hidden>
  <div id="side">
    <div class="me">
      <div class="mu">WELCOME,</div>
      <div id="who"></div>
      <div class="mu" style="font-size:11px;">INVITE CODE</div>
      <div class="code" id="code"></div>
      <div class="row" style="margin-top:16px;">
        <button class="g" id="cp" type="button" style="flex:1; font-size:13px; padding:10px;">Copy</button>
        <button class="g" id="out" type="button" style="flex:1; font-size:13px; padding:10px;">Log Out</button>
      </div>
      <div id="net" class="mu"></div>
    </div>
    
    <div class="row" style="margin-top:8px;"><input id="search" placeholder="Cari kontak..." autocomplete="off" style="background:transparent; padding:10px 14px; font-size:14px;"></div>
    <div class="row"><input id="fc" placeholder="Kode teman..." autocomplete="off" maxlength="24" style="background:transparent; padding:10px 14px; font-size:14px;"><button id="add" type="button" style="padding:10px 16px; font-size:14px;">Add</button></div>
    <div id="fm" class="mu" style="text-align:center;"></div>
    <div id="list"></div>
    <div class="credits" style="margin-top: auto; padding-top: 10px;">Created by Bustami Atmadja × DeepSeek</div>
  </div>
  
  <div id="main">
    <div id="head">
      <button class="g" id="back" type="button">Kembali</button>
      
      <div id="peer">
        <span id="peer-name">Pilih percakapan</span>
        <span id="peer-status"></span>
      </div>
      
      <button id="btnThemeToggle" type="button" title="Ubah Tema">🌓</button>
      <button id="btnDelAll" type="button" title="Hapus semua pesan di ruangan ini">🗑️</button>

    <div id="chat-container">
      <div id="msgs"></div>

    <div id="note" class="mu" style="padding:0 24px; text-align:center;"></div>
    
    <form id="form" hidden>
      <button type="button" id="btnImg" class="btn-tool" title="Kirim Gambar">🖼️</button>
      <button type="button" id="btnMic" class="btn-tool" title="Rekam pesan suara">🎤</button>
      <input id="t" maxlength="500" placeholder="Tulis pesan..." autocomplete="off">
      <button type="submit" title="Kirim">Kirim</button>
    </form>
  </div>
</div>

<input type="file" id="fileImg" accept="image/*" hidden>
<div id="ctxMenu" hidden>
  <button id="btnEdit">Edit Pesan</button>
  <button id="btnDel" class="del">Hapus Pesan</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s),PFX="armadilochat-tomi-";
let me=null,peer=null,conns={},contacts={},msgs={},cur=null,mode="L",fails=0,lock=0,pend=null,retry=0;
let storDismissed=false,storCountdown=0;
const LIMIT=5*1024*1024;
const STOR_CHECK_EVERY=20;
const EDIT_TIME_LIMIT = 15 * 60 * 1000;
let ctxTarget = null;

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let isProcessingAudio = false;

let myTypingTimeout = null;
let isTyping = false;
let partnerTypingTimeout = null;
let lastTypingSent = 0;

function applyTheme(isDark) {
  if (isDark) { document.body.classList.add("dark-theme"); localStorage.setItem("ac_theme", "dark"); } 
  else { document.body.classList.remove("dark-theme"); localStorage.setItem("ac_theme", "light"); }
}
if (localStorage.getItem("ac_theme") === "dark" || (!localStorage.getItem("ac_theme") && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
  document.body.classList.add("dark-theme");
} else { document.body.classList.remove("dark-theme"); }
function toggleTheme() { applyTheme(!document.body.classList.contains("dark-theme")); }
$("#themeToggleAuth").onclick = toggleTheme;
$("#btnThemeToggle").onclick = toggleTheme;

let db;
const dbReq = indexedDB.open("ArmadiloChatDB", 1);
dbReq.onupgradeneeded = e => { db = e.target.result; if (!db.objectStoreNames.contains("media")) { db.createObjectStore("media"); } };
dbReq.onsuccess = e => { db = e.target.result; };
dbReq.onerror = e => { console.error("IndexedDB error:", e); };

function saveMedia(id, blob) { return new Promise((resolve, reject) => { if(!db) return reject("DB belum siap"); const tx = db.transaction("media", "readwrite"); tx.objectStore("media").put(blob, id); tx.oncomplete = () => resolve(); tx.onerror = e => reject(e); }); }
function getMedia(id) { return new Promise((resolve, reject) => { if(!db) return reject("DB belum siap"); const tx = db.transaction("media", "readonly"); const req = tx.objectStore("media").get(id); req.onsuccess = () => resolve(req.result); req.onerror = e => reject(e); }); }
function delMedia(id) { return new Promise((resolve, reject) => { if(!db) return resolve(); const tx = db.transaction("media", "readwrite"); tx.objectStore("media").delete(id); tx.oncomplete = () => resolve(); tx.onerror = e => reject(e); }); }
function clearMediaByPrefix(prefix) { return new Promise((resolve, reject) => { if(!db) return resolve(); const tx = db.transaction("media", "readwrite"); const store = tx.objectStore("media"); const req = store.openKeyCursor(); req.onsuccess = e => { const cursor = e.target.result; if (cursor) { if (cursor.key.startsWith(prefix)) { store.delete(cursor.key); } cursor.continue(); } }; tx.oncomplete = () => resolve(); tx.onerror = e => reject(e); }); }

const enc=new TextEncoder();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const rnd=()=>hex(crypto.getRandomValues(new Uint8Array(16)));
const gs=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const ss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let users=gs("ac_users",{});
const say=t=>{$("#msg").textContent=t},net=t=>{$("#net").textContent=t};
const cleanCode=s=>String(s||"").replace(/[^A-Za-z0-9]/g,"").slice(0,24);

function blobToBase64(blob) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onloadend = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(blob); }); }
function base64ToBlob(base64) { const parts = base64.split(';base64,'); const contentType = parts[0].split(':')[1]; const raw = window.atob(parts[1]); const rawLength = raw.length; const uInt8Array = new Uint8Array(rawLength); for (let i = 0; i < rawLength; ++i) { uInt8Array[i] = raw.charCodeAt(i); } return new Blob([uInt8Array], {type: contentType}); }
function compressImage(file, maxWidth = 800) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = event => { const img = new Image(); img.src = event.target.result; img.onload = () => { let width = img.width; let height = img.height; if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; } const canvas = document.createElement("canvas"); canvas.width = width; canvas.height = height; const ctx = canvas.getContext("2d"); ctx.drawImage(img, 0, 0, width, height); canvas.toBlob(blob => resolve(blob), "image/jpeg", 0.7); }; img.onerror = err => reject(err); }; reader.onerror = err => reject(err); }); }
